name = "irish-mgmt-booking"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[vars]
SITE_NAME = "Irish Management"
# Your OwnerRez login email. Leave blank only if you use an OAuth access token instead of a pt_ token.
OWNERREZ_EMAIL = ""
# Full public address of the site, used for the after-booking redirect. Example: https://stay.irishmgmt.com
SITE_URL = ""
CONTACT_PHONE = ""
CONTACT_EMAIL = ""
# Properties whose name contains any of these (comma separated) are hidden from the site.
EXCLUDE_NAME_CONTAINS = "Home Watch"
# Optional: only show properties with this OwnerRez tag, for example "Direct Booking".
REQUIRE_TAG = ""

# The API token is a secret. Set it with:  npx wrangler secret put OWNERREZ_TOKEN
